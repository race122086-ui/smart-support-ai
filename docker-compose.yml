services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartsupport
      POSTGRES_USER: smartsupport
      POSTGRES_PASSWORD: smartsupport
    ports:
      - "5432:5432"
    volumes:
      - smartsupport-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsupport -d smartsupport"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartsupport-postgres:
